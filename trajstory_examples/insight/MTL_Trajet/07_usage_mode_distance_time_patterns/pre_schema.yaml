# Partial specification for data construction.
# Fill in only the concepts and constraints you want to control.
# Any omitted IDs, timestamps, GPS points, metrics, or support tables may be
# added when they are necessary to realize the supplied goal and insights.

pre_schema_version: "1.0"

# Optional one-line context for the constructor.
domain: "" # e.g., urban_multimodal_mobility
goal: "Based on trajectories with different usages, analyze the relationship between usages and other attributes"
insights:
  - "Shopping, leisure, and pick-up trips show greater motor-vehicle reliance than education trips."
  - "Trips for pick-up sustain relatively longer distances than other usages, but a few outliers with very long durations exist."
  - "Education trips are concentrated in fixed morning and afternoon windows, whereas the other usages are more dispersed across the afternoon and evening."

# Only list core fields that must appear in the final data.
# Delete unused examples and add as few fields as you need.
fields:
  - name: "average distance of pick-up trips"
    semantic_type: "" # categorical | numeric | temporal | spatial | identifier
    type: float64
    mean_value: [7.6] 
    range: [3.3, 17]

  - name: "average duration of pick-up trips"
    semantic_type: "" # categorical | numeric | temporal | spatial | identifier
    type: float64
    mean_value: [20] 
    range: [8, 62]
    outliners: [51,55,62,55]

constraints:
  - "可以给单日数据，但是要多条轨迹，总共给200条，每个usage50条"

# Optional prohibitions, for example a sensitive field or an unwanted label.
# prohibited_fields: []
