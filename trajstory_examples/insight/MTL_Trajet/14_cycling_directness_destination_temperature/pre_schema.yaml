goal: Find obvious cycling patterns in the city and exceptional cases if possible based on trajectories of different users.
insights:
- Cycling trajectories usually follow a route directness ratio lower than 1.5.
- The four cycling trajectories with a route directness ratio above 1.5 all contain bike-lane points along only part of the
  route.
- Cycling destinations form distinct morning, midday, and evening spatial clusters. Morning endpoints are mainly in diversified-activity
  areas and midday endpoints are in Mixte areas; evening endpoints span several mapped land uses, with four outside the reference
  polygons.
- Cycling speed generally increases with temperature.
