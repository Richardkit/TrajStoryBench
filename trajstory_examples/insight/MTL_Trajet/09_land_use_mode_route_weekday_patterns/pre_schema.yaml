goal: Identify the characteristics of three land-use types and their corresponding mobility behaviours from the trajectory
  data.
insights:
- Mixte and economic-activity destinations each have diverse transport-mode compositions and share the same set of mode categories.
- Agricultural-area trajectories are all motor-vehicle trips with nearly identical route-directness values and closely overlapping
  routes.
- Mixte destinations occupy the central and eastern part of the study area; economic-activity destinations occur along the
  northern and southern edges as well as at scattered locations; agricultural destinations are confined to the southwest.
- Only Mixte-destination trajectories occur on both weekdays and weekends; economic-activity and agricultural destinations
  occur only on weekdays.
